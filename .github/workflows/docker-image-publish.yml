name: Docker Image Publish

on:
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck orchestrator
        run: pnpm exec tsc -p orchestrator/tsconfig.json --noEmit

      - name: Generate Docker build verification
        run: pnpm exec tsx orchestrator/src/factoryCli.ts verify-docker-build runtime/workspaces/dockercompliancegenerationtest

      - name: Upload Docker build report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-build-report
          path: artifacts/reports/docker-build-report.json
