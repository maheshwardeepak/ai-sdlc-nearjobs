name: Verify NearJobs

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  verify-nearjobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install factory dependencies
        run: pnpm install

      - name: Install frontend dependencies
        working-directory: projects/nearjobs/frontend
        run: npm install

      - name: Install Playwright Chromium
        working-directory: projects/nearjobs/frontend
        run: npx playwright install --with-deps chromium

      - name: Build Docker stack
        working-directory: projects/nearjobs
        run: docker compose -f infra/docker-compose.yml up --build -d

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          docker logs nearjobs-backend || true
          exit 1

      - name: Verify project
        run: pnpm exec tsx orchestrator/src/factoryCli.ts verify-project nearjobs

      - name: Shutdown Docker stack
        if: always()
        working-directory: projects/nearjobs
        run: docker compose -f infra/docker-compose.yml down --remove-orphans
